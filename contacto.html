<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto | Hermanos Jota — Muebles de autor</title>
    <meta
      name="description"
      content="Mueblería Hermanos Jota. Piezas de madera hechas en taller familiar en Buenos Aires."
    />
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main>
  <section class="seccion-contacto">
    <h2>Centro de Ayuda y Contacto</h2>
    <p>Completá los datos y te responderemos a la brevedad.</p>

    <form id="formulario-contacto">
      
      <label for="nombre">Nombre Completo:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" required>

      <label for="mensaje">Tu Mensaje / Feedback:</label>
      <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

      <button type="submit" id="btn-enviar">Enviar Mensaje</button>
      
    </form>

    <div id="mensaje-feedback"></div>

  </section>
</main>

  <script type="module" src="js/contacto.js"></script>
</body>
</html>
